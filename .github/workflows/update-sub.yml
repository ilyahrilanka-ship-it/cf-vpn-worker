name: update subscription
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-sub
  cancel-in-progress: true
jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Отбор 3 лучших узлов
        env:
          CF_WORKER_HOST: vpn-test.ilyahrilanka.workers.dev
          CF_WORKER_UUID: ${{ vars.CF_WORKER_UUID }}
        run: python3 pick3.py
      - name: Публикация
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cf3.txt cf3-plain.txt cf3.json
          if git diff --cached --quiet; then
            echo "изменений нет — подписка не тронута"
          else
            git commit -m "sub: 3 best nodes ($(date -u +%H:%M) UTC)"
            git push
          fi
